# Adapter registry — OURS: Qwen/Qwen3-8B with our own trained LoRAs for
# sql/legal/medical (E3 first pass, see docs/results.md and
# docs/superpowers/specs/2026-09-20-e3-sql-lora-sft-design.md). Remaining
# domains (grammar/summarizer/code) stay passthrough — not trained yet (P1).
# See docs/superpowers/specs/2026-09-20-e1-qwen3-8b-baseline-design.md for
# the chat_template_kwargs / thinking-suppression rationale.
# The controller loads this file on startup and hot-reloads via POST /registry/reload.
#
# The prior B0 (all-passthrough) and Llama-3.1-8B + public-adapter configs
# are recoverable via `git log -- adapters.yaml` for baseline comparisons.

adapters:

  sql:
    path: postovyi/qwen3-8b-sql-lora
    description: "Translates natural language questions into SQL queries for relational databases."
    rank: 32
    base_model: Qwen/Qwen3-8B
    passthrough: false
    chat_template_kwargs: {enable_thinking: false}
    tags: [sql, code, database]

  legal:
    path: postovyi/qwen3-8b-legal-lora
    description: "Interprets legal documents, answers legal questions, and drafts legal text."
    rank: 32
    base_model: Qwen/Qwen3-8B
    passthrough: false
    chat_template_kwargs: {enable_thinking: false}
    tags: [legal, professional]

  medical:
    path: postovyi/qwen3-8b-medical-lora
    description: "Answers clinical and medical questions based on healthcare knowledge."
    rank: 32
    base_model: Qwen/Qwen3-8B
    passthrough: false
    chat_template_kwargs: {enable_thinking: false}
    tags: [medical, clinical, healthcare]

  grammar:
    path: "__passthrough__"
    description: "Corrects grammar, spelling, and style errors in English text."
    rank: 0
    base_model: Qwen/Qwen3-8B
    passthrough: true
    chat_template_kwargs: {enable_thinking: false}
    tags: [grammar, correction, writing]

  summarizer:
    path: "__passthrough__"
    description: "Summarizes long documents and passages into concise, accurate form."
    rank: 0
    base_model: Qwen/Qwen3-8B
    passthrough: true
    chat_template_kwargs: {enable_thinking: false}
    tags: [summarization, nlp]

  code:
    path: "__passthrough__"
    description: "Generates, explains, and debugs Python code from natural language instructions."
    rank: 0
    base_model: Qwen/Qwen3-8B
    passthrough: true
    chat_template_kwargs: {enable_thinking: false}
    tags: [code, python, programming]
